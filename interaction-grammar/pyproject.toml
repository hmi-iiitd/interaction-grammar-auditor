[project]
name = "interaction-compiler"
version = "0.1.0"
description = "A compiler for interaction contracts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "lark>=1.1.9",
    "jsonschema>=4.21.1",
    "z3-solver>=4.12.0",
]

[project.scripts]
interaction-compiler = "src.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
